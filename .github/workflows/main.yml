name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path("Track2NFC_GitHub_Ready.zip")
          destination = Path("android-project")

          if not archive.is_file():
              raise FileNotFoundError(f"Project archive not found: {archive}")

          destination.mkdir(parents=True, exist_ok=True)
          root = destination.resolve()

          with ZipFile(archive) as project_zip:
              for entry in project_zip.infolist():
                  member = PurePosixPath(entry.filename)
                  if member.is_absolute() or ".." in member.parts:
                      raise ValueError(f"Unsafe path in ZIP archive: {entry.filename}")

                  target = (destination / Path(*member.parts)).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError(f"Unsafe extraction target: {entry.filename}")

                  project_zip.extract(entry, destination)

          print(f"Extracted {archive} into {destination}")
          PY

      - name: Find Android Gradle project
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path("android-project")
          projects = [
              wrapper.parent
              for wrapper in root.rglob("gradlew")
              if (wrapper.parent / "settings.gradle").is_file()
              or (wrapper.parent / "settings.gradle.kts").is_file()
          ]

          if not projects:
              raise FileNotFoundError(
                  "Could not find gradlew alongside settings.gradle or "
                  "settings.gradle.kts in the extracted ZIP."
              )

          project_dir = min(projects, key=lambda path: len(path.parts)).resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ANDROID_PROJECT_DIR={project_dir}\n")
          print(f"Using Android Gradle project at {project_dir}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Track2NFC-debug-apk
          path: android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
