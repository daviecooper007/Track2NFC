name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and build
        run: |
          set -e
          unzip -q Track2NFC_GitHub_Ready.zip -d project
          gradlew=$(find project -type f -name gradlew -print -quit)
          if [ -z "$gradlew" ]; then
            echo "Could not find gradlew in the extracted project"
            exit 1
          fi
          cd "$(dirname "$gradlew")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
