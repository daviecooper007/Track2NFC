  - name: Extract Android project
    run: |
      python - <<'PY'
      from pathlib import Path, PurePosixPath
      from zipfile import ZipFile

      archive = Path("Track2NFC_GitHub_Ready.zip")
      destination = Path("android-project")

      if not archive.is_file():
          raise FileNotFoundError(f"Project archive not found: {archive}")

      destination.mkdir(parents=True, exist_ok=True)
      root = destination.resolve()

      with ZipFile(archive) as project_zip:
          for entry in project_zip.infolist():
              member = PurePosixPath(entry.filename)
              if member.is_absolute() or ".." in member.parts:
                  raise ValueError(f"Unsafe path in ZIP archive: {entry.filename}")

              target = (destination / Path(*member.parts)).resolve()
              if not target.is_relative_to(root):
                  raise ValueError(f"Unsafe extraction target: {entry.filename}")

              project_zip.extract(entry, destination)

      print(f"Extracted {archive} into {destination}")
      PY

  - name: Upload extracted project
    uses: actions/upload-artifact@v4
    with:
      name: android-project
      path: android-project/
