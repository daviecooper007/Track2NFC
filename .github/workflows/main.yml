      - name: Extract and build
        run: |
          unzip -q Track2NFC_GitHub_Ready.zip -d project
          gradlew=$(find project -type f -name gradlew -print -quit)
          if [ -z "$gradlew" ]; then
            echo "Could not find gradlew in the extracted project"
            exit 1
          fi
          cd "$(dirname "$gradlew")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
