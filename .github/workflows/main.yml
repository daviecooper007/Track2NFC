name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          if [ ! -f Track2NFC_GitHub_Ready.zip ]; then
            echo "Track2NFC_GitHub_Ready.zip was not found"
            exit 1
          fi
          mkdir -p project
          unzip -q Track2NFC_GitHub_Ready.zip -d project

      - name: Build debug APK
        run: |
          gradlew=$(find project -type f -name gradlew -print -quit)
          if [ -z "$gradlew" ]; then
            echo "No gradlew file found in the extracted ZIP"
            exit 1
          fi

          chmod +x "$gradlew"
          cd "$(dirname "$gradlew")"
          ./gradlew assembleDebug --no-daemon

          apk=$(find "$GITHUB_WORKSPACE/project" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "Build finished but no debug APK was found"
            exit 1
          fi
          echo "APK created: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Track2NFC-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
